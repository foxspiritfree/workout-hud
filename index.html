<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workout HUD — 居家運動專注儀表板</title>
  <meta name="theme-color" content="#0b0e14">
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #141822;
      --card-border: #232a3b;
      --text-main: #f0f4fc;
      --text-muted: #8b9bb4;
      --accent: #10b981;
      --accent-dim: rgba(16, 185, 129, 0.15);
      --accent-glow: rgba(16, 185, 129, 0.35);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.15);
      --blue: #3b82f6;
      --blue-dim: rgba(59, 130, 246, 0.15);
      --red: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: calc(76px + var(--safe-bottom));
    }

    /* Top Bar */
    header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 14, 20, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: var(--accent);
      font-size: 0.75rem;
      background: var(--accent-dim);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent);
    }

    .top-actions {
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pill-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Status Card */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-info h2 {
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-info p {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 3px 6px;
      border-radius: 6px;
      background: #1f2737;
      color: #93c5fd;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Double Progression Alert */
    .progress-banner {
      background: var(--accent-dim);
      border: 1px dashed var(--accent);
      color: #a7f3d0;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: none;
      align-items: center;
      gap: 6px;
      line-height: 1.4;
    }

    /* Floor Containers (空間分流視覺) */
    .floor-section {
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid transparent;
    }

    .floor-upstairs {
      background: linear-gradient(180deg, rgba(30, 58, 138, 0.16) 0%, rgba(15, 23, 42, 0.3) 100%);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .floor-downstairs {
      background: linear-gradient(180deg, rgba(6, 78, 59, 0.16) 0%, rgba(6, 40, 32, 0.3) 100%);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .floor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 2px 4px 2px;
    }

    .floor-title-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .badge-blue {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .badge-green {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .floor-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Floor Transition Card */
    .floor-transition-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: #111827;
      border: 1px dashed #374151;
      border-radius: 10px;
      color: #d1d5db;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Exercise Card */
    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .ex-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .ex-title {
      font-size: 0.98rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ex-tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      background: #1e2638;
      color: #94a3b8;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: #1c2333;
      border: 1px solid #2b364d;
      color: #94a3b8;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: #2b364d;
    }

    /* Primary External Focus Cue */
    .focus-cue-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.76rem;
      color: #fcd34d;
      line-height: 1.35;
    }

    .focus-cue-row span.icon {
      flex-shrink: 0;
    }

    /* Guide Collapsible Drawer */
    .guide-drawer {
      display: none;
      background: #0d121c;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.76rem;
      line-height: 1.45;
      animation: fadeIn 0.2s ease;
    }

    .guide-drawer.open {
      display: block;
    }

    .guide-block {
      margin-bottom: 6px;
    }

    .guide-block:last-child {
      margin-bottom: 0;
    }

    .guide-label {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 1px;
    }

    .guide-text {
      color: #cbd5e1;
      padding-left: 10px;
    }

    /* Equipment & Rest Compact Selector Bar */
    .compact-selector-bar {
      background: #0d111a;
      border: 1px solid #1e2638;
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .selector-row {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .selector-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      min-width: 38px;
      font-weight: 600;
    }

    .pills-group {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
      flex: 1;
    }

    .pill-opt {
      font-size: 0.72rem;
      font-weight: 600;
      background: #182030;
      border: 1px solid #28344c;
      color: #94a3b8;
      padding: 3px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.12s;
    }

    .pill-opt.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: #6ee7b7;
      font-weight: 700;
    }

    .pill-opt:active {
      transform: scale(0.95);
    }

    /* Sets Table (Zero Horizontal Overflow, 276px Total Width) */
    .sets-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2px;
    }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-top: 1px solid #1a2232;
      gap: 8px;
    }

    .set-num {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      width: 48px;
      flex-shrink: 0;
    }

    .set-reps-control {
      display: flex;
      align-items: center;
      background: #0d111a;
      border: 1px solid #232b3e;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .reps-input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 16px; /* Lock 16px to prevent iOS auto-zoom */
      font-weight: 700;
      width: 42px;
      text-align: center;
      padding: 6px 0;
    }

    .unit-label {
      font-size: 0.74rem;
      color: var(--text-muted);
      padding-right: 6px;
    }

    .adj-btn {
      background: #1c2333;
      color: #cbd5e1;
      border: none;
      width: 36px;
      height: 36px;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
    }

    .adj-btn:active {
      background: var(--accent);
      color: #000;
    }

    .set-action {
      width: 72px;
      text-align: right;
      flex-shrink: 0;
    }

    .check-btn {
      background: #1c2333;
      border: 1px solid #2b364d;
      color: var(--text-muted);
      border-radius: 7px;
      height: 36px;
      width: 100%;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .check-btn.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #042f2e;
    }

    /* Floating Rest Timer HUD (底部避讓 Safe Area) */
    .timer-floating-hud {
      position: fixed;
      bottom: calc(64px + var(--safe-bottom));
      left: 12px;
      right: 12px;
      max-width: 576px;
      margin: 0 auto;
      background: rgba(18, 23, 34, 0.96);
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow), 0 8px 24px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 10px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 80;
      animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .timer-floating-hud.active {
      display: flex;
    }

    .timer-info-block {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .timer-title {
      font-size: 0.72rem;
      color: #a7f3d0;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .timer-clock {
      font-family: var(--font-mono);
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1;
      color: #fff;
    }

    .timer-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-accent {
      background: var(--accent);
      color: #042f2e;
    }

    .btn-secondary {
      background: #232a3b;
      color: var(--text-main);
    }

    .btn-amber {
      background: var(--amber);
      color: #451a03;
    }

    /* Zone 2 Card */
    .zone2-card {
      background: linear-gradient(145deg, #121824, #0d121c);
      border: 1px solid #223049;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      position: relative;
    }

    .breath-circle-wrap {
      width: 100px;
      height: 100px;
      margin: 8px auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .breath-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.74rem;
      color: var(--accent);
      transition: transform 4s ease-in-out;
    }

    .breath-circle.inhale {
      transform: scale(1.26);
      background: rgba(16, 185, 129, 0.28);
    }

    .breath-circle.exhale {
      transform: scale(0.88);
      background: var(--accent-dim);
    }

    /* Sticky Footer */
    footer {
      padding: 10px 16px;
      padding-bottom: calc(10px + var(--safe-bottom));
      height: calc(56px + var(--safe-bottom));
      background: rgba(20, 24, 34, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 70;
      max-width: 600px;
      margin: 0 auto;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal for Backup / Settings */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .setting-group {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e2638;
    }

    .setting-group h4 {
      font-size: 0.82rem;
      color: #93c5fd;
      margin-bottom: 4px;
    }

    .setting-input {
      width: 100%;
      background: #0d111a;
      border: 1px solid #2b364d;
      color: #fff;
      padding: 7px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-top: 3px;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand">
      WORKOUT <span>HUD</span>
    </div>
    <div class="top-actions">
      <button class="pill-btn" id="btn-switch-a" onclick="switchWorkout('A')">Day A (推/膝/抗伸)</button>
      <button class="pill-btn" id="btn-switch-b" onclick="switchWorkout('B')">Day B (拉/髖/抗旋)</button>
      <button class="pill-btn" onclick="openBackupModal()" title="器材規格與資料備份">⚙️</button>
    </div>
  </header>

  <!-- Main View -->
  <main>

    <!-- Status & Smart Advisory -->
    <div class="status-card">
      <div class="status-info">
        <h2 id="current-day-heading">今日課表：Day A</h2>
        <p id="last-workout-status">上一次訓練：計算中...</p>
      </div>
      <div class="status-tag" id="status-tag">做二休二狀態機</div>
    </div>

    <!-- Double Progression Alert -->
    <div class="progress-banner" id="progress-banner">
      🔥 <span id="progress-banner-text">目標達成！已解鎖下一次升重門檻。</span>
    </div>

    <!-- Dynamic Workout Content -->
    <div id="workout-content">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <!-- Floating Rest Timer HUD (避讓底部安全區) -->
  <div class="timer-floating-hud" id="timer-hud">
    <div class="timer-info-block">
      <div class="timer-title" id="timer-label">組間休息倒數</div>
      <div class="timer-clock" id="timer-clock">00:45</div>
    </div>
    <div class="timer-controls">
      <button class="btn btn-secondary" onclick="adjustTimer(-15)">-15s</button>
      <button class="btn btn-secondary" onclick="adjustTimer(+15)">+15s</button>
      <button class="btn btn-amber" onclick="skipTimer()">跳過 ➔</button>
    </div>
  </div>

  <!-- Sticky Bottom Finish Bar -->
  <footer>
    <div>
      <div style="font-size: 0.7rem; color: var(--text-muted);">本輪進度</div>
      <div style="font-size: 0.92rem; font-weight: 700;" id="completion-counter">0 / 12 組完成</div>
    </div>
    <button class="btn btn-accent" style="padding: 8px 18px; font-size: 0.9rem;" onclick="finishWorkoutSession()">
      完結今日課表 🏆
    </button>
  </footer>

  <!-- Modal: Settings & Data Backup -->
  <div class="modal-overlay" id="backup-modal" onclick="closeBackupModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 style="margin-bottom: 10px; font-size: 1rem; display: flex; align-items: center; gap: 6px;">
        ⚙️ 器材規格與數據管理
      </h3>

      <div class="setting-group">
        <h4>🏋️ 可調壺鈴 5 段重量 (kg)</h4>
        <p style="font-size: 0.72rem; color: var(--text-muted);">請用逗號分隔 5 個段位數值</p>
        <input type="text" class="setting-input" id="cfg-kb-weights" value="8, 12, 16, 20, 24" onchange="saveCustomConfig()">
      </div>

      <div class="setting-group">
        <h4>🎗️ 彈力帶 4 強度標籤</h4>
        <p style="font-size: 0.72rem; color: var(--text-muted);">請用逗號分隔 4 個強度色號或名稱</p>
        <input type="text" class="setting-input" id="cfg-band-levels" value="極輕, 輕阻力, 中阻力, 重阻力" onchange="saveCustomConfig()">
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 12px;">
        <button class="btn btn-secondary" onclick="exportDataJson()">📥 匯出紀錄備份 (JSON)</button>
        <label class="btn btn-secondary" style="cursor: pointer; text-align: center;">
          📤 匯入備份檔案
          <input type="file" id="import-file-input" style="display: none;" onchange="importDataJson(event)" accept=".json">
        </label>
        <button class="btn btn-amber" onclick="resetAllDemoData()">⚠️ 重設為初始預設課表</button>
        <button class="btn btn-secondary" onclick="closeBackupModal(null)">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. DATA SCHEMA & EXERCISE TEMPLATES
    // ==========================================
    const DEFAULT_CONFIG = {
      kbLevels: [8, 12, 16, 20, 24], // 升級為 5 段重量
      bandLevels: ["極輕", "輕阻力", "中阻力", "重阻力"],
      bandRings: [1, 2, 3, 4, 5, 6, 7],
      restOptions: [30, 45, 60, 90]
    };

    const TEMPLATES = {
      A: {
        title: "Day A — 推 ＋ 膝主導 ＋ 側肩三頭 ＋ 核心抗伸展",
        floor1: {
          title: "2F 樓上區 · 彈力帶門錨 ＆ 墊上核心",
          hint: "彈力帶伏地挺身 / 側平舉 / 核心抗伸展",
          exercises: [
            {
              id: "a_pushup",
              name: "彈力繩繞背伏地挺身",
              tag: "胸推 / 前鋸肌肩胛前引",

    // 永久鎖定 Storage Key，並提供跨版本向下相容平滑遷移
    const STORAGE_KEY = "WORKOUT_HUD_STORE_PERMANENT";

    let state = {
      activeDay: null,
      lastCompletedDay: null,
      lastCompletedTime: null,
      history: [],
      records: {},
      customOrder: { A: [], B: [] },

    // ==========================================
    // 2. WAKE LOCK API (防休眠防漂移)
    // ==========================================
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("WakeLock unavailable", err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => wakeLock = null).catch(() => {});
      }
    }

    // ==========================================
    // 3. AUDIO SYNTHESIZER (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function unlockAudioOnFirstInteraction() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      document.removeEventListener('touchstart', unlockAudioOnFirstInteraction);
      document.removeEventListener('click', unlockAudioOnFirstInteraction);
    }
    document.addEventListener('touchstart', unlockAudioOnFirstInteraction, { passive: true });
    document.addEventListener('click', unlockAudioOnFirstInteraction, { passive: true });

    async function playBeep(freq = 880, duration = 0.12) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Audio play blocked", e);
      }
    }

    // ==========================================
    // 4. PERSISTENCE & AUTO-MIGRATION (永不重置)
    // ==========================================
    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY) || 
                  localStorage.getItem("WORKOUT_HUD_STORE_V3") || 
                  localStorage.getItem("WORKOUT_HUD_STORE_V2");
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
          if (!state.config) state.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
          if (!state.config.kbLevels || state.config.kbLevels.length !== 5) {
            state.config.kbLevels = [8, 12, 16, 20, 24];
          }
          if (!state.customOrder) state.customOrder = { A: [], B: [] };
        } catch (e) {
          console.error("Failed to parse storage", e);
        }
      }
      if (!state.activeDay) {
        state.activeDay = (state.lastCompletedDay === "A") ? "B" : "A";
      }
      saveState(); // 將舊版本資料自動平滑遷移至永久 Key
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // ==========================================
    // 5. REST TIMER (底部常駐懸浮膠囊)
    // ==========================================
    let timerInterval = null;
    let timerEndTime = null;
    let timerRemaining = 0;

    function startRestTimer(seconds, exName = "") {
      clearInterval(timerInterval);
      requestWakeLock();
      
      const hud = document.getElementById("timer-hud");
      hud.classList.add("active");
      document.getElementById("timer-label").textContent = exName ? `組間休息 · ${exName}` : "組間休息倒數";
      
      timerEndTime = Date.now() + seconds * 1000;
      timerRemaining = seconds;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timerRemaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
        
        if (timerRemaining <= 3 && timerRemaining > 0) {
          playBeep(660, 0.1);
        } else if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          releaseWakeLock();
          playBeep(1320, 0.4);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          hud.classList.remove("active");
        }
        updateTimerDisplay();
      }, 500);
    }

    function updateTimerDisplay() {
      const min = Math.floor(Math.max(0, timerRemaining) / 60);
      const sec = Math.max(0, timerRemaining) % 60;
      document.getElementById("timer-clock").textContent = 
        `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function adjustTimer(diff) {
      if (!timerEndTime) return;
      timerEndTime += diff * 1000;
      timerRemaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
      updateTimerDisplay();
    }

    function skipTimer() {
      clearInterval(timerInterval);
      releaseWakeLock();
      document.getElementById("timer-hud").classList.remove("active");
    }

    // ==========================================
    // 6. ZONE 2 BIKING & BREATH PACER
    // ==========================================
    let zone2Interval = null;
    let zone2EndTime = null;
    let zone2Remaining = 18 * 60;
    let breathInterval = null;
    let isZone2Running = false;

    function toggleZone2() {
      const btn = document.getElementById("btn-zone2-toggle");
      if (isZone2Running) {
        clearInterval(zone2Interval);
        clearInterval(breathInterval);
        releaseWakeLock();
        isZone2Running = false;
        btn.textContent = "繼續踩踏";
        btn.classList.remove("btn-amber");
        btn.classList.add("btn-accent");
      } else {
        isZone2Running = true;
        requestWakeLock();
        btn.textContent = "暫停踩踏";
        btn.classList.remove("btn-accent");
        btn.classList.add("btn-amber");
        runBreathCycle();

        zone2EndTime = Date.now() + zone2Remaining * 1000;

        zone2Interval = setInterval(() => {
          zone2Remaining = Math.max(0, Math.round((zone2EndTime - Date.now()) / 1000));
          if (zone2Remaining <= 0) {
            clearInterval(zone2Interval);
            clearInterval(breathInterval);
            releaseWakeLock();
            playBeep(1760, 0.8);
            if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
            alert("🎉 Zone 2 踩踏完成！微血管與粒線體代謝修復完成。");
          }
          renderZone2Display();
        }, 500);
      }
    }

    function runBreathCycle() {
      const circle = document.getElementById("breath-circle");
      const text = document.getElementById("breath-text");
      let phase = "inhale";

      const step = () => {
        if (!isZone2Running) return;
        if (phase === "inhale") {
          circle.classList.remove("exhale");
          circle.classList.add("inhale");
          text.textContent = "鼻吸氣 (4s)";
          phase = "exhale";
        } else {
          circle.classList.remove("inhale");
          circle.classList.add("exhale");
          text.textContent = "鼻呼氣 (4s)";
          phase = "inhale";
        }
      };
      step();
      breathInterval = setInterval(step, 4000);
    }

    function resetZone2() {
      clearInterval(zone2Interval);
      clearInterval(breathInterval);
      releaseWakeLock();
      isZone2Running = false;
      zone2Remaining = 18 * 60;
      const btn = document.getElementById("btn-zone2-toggle");
      if (btn) {
        btn.textContent = "開始踩踏";
        btn.className = "btn btn-accent";
      }
      const circle = document.getElementById("breath-circle");
      if (circle) circle.className = "breath-circle";
      const text = document.getElementById("breath-text");
      if (text) text.textContent = "準備吸氣";
      renderZone2Display();
    }

    function renderZone2Display() {
      const el = document.getElementById("zone2-timer");
      if (!el) return;
      const min = Math.floor(zone2Remaining / 60);
      const sec = zone2Remaining % 60;
      el.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    // ==========================================
    // 7. RENDER ENGINE & COMPACT INTERACTIONS
    // ==========================================
    function switchWorkout(day) {
      state.activeDay = day;
      saveState();
      renderAll();
    }

    function getExercisesForFloor(day, floorKey) {
      const defaultList = TEMPLATES[day][floorKey].exercises;
      const orderList = state.customOrder[day] || [];
      if (orderList.length === 0) return [...defaultList];

      const sorted = [];
      orderList.forEach(id => {
        const found = defaultList.find(e => e.id === id);
        if (found) sorted.push(found);
      });
      defaultList.forEach(e => {
        if (!sorted.includes(e)) sorted.push(e);
      });
      return sorted;
    }

    function moveExercise(exId, direction) {
      const day = state.activeDay;
      const floorKey = findExerciseFloor(day, exId);
      if (!floorKey) return;

      const currentList = getExercisesForFloor(day, floorKey);
      const idx = currentList.findIndex(e => e.id === exId);
      if (idx === -1) return;

      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= currentList.length) return;

      const temp = currentList[idx];
      currentList[idx] = currentList[newIdx];
      currentList[newIdx] = temp;

      const otherFloorKey = (floorKey === "floor1") ? "floor2" : "floor1";
      const otherList = getExercisesForFloor(day, otherFloorKey);
      
      if (floorKey === "floor1") {
        state.customOrder[day] = [...currentList.map(e => e.id), ...otherList.map(e => e.id)];
      } else {
        state.customOrder[day] = [...otherList.map(e => e.id), ...currentList.map(e => e.id)];
      }

      saveState();
      renderAll();
    }

    function findExerciseFloor(day, exId) {
      if (TEMPLATES[day].floor1.exercises.some(e => e.id === exId)) return "floor1";
      if (TEMPLATES[day].floor2.exercises.some(e => e.id === exId)) return "floor2";
      return null;
    }

              <div class="selector-row">
                <span class="selector-label">重量:</span>
                <div class="pills-group">
                  ${kbWeights.map(w => `
                    <button class="pill-opt ${curKg === w ? 'active' : ''}" 
                      onclick="selectKbWeight('${ex.id}', ${w})">${w}kg</button>
                  `).join('')}
                </div>
              </div>
              <div class="selector-row">
                <span class="selector-label">休息:</span>
                <div class="pills-group">
                  ${state.config.restOptions.map(r => `
                    <button class="pill-opt ${restSec === r ? 'active' : ''}" 
                      onclick="setExerciseRest('${ex.id}', ${r})">${r}s</button>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        } else if (ex.toolType === "band") {
          const bandLevels = state.config.bandLevels || DEFAULT_CONFIG.bandLevels;
          const bandRings = state.config.bandRings || DEFAULT_CONFIG.bandRings;
          
          let curBand = bandLevels[1];
          let curRing = 3;
          if (typeof rec.weight === "string" && rec.weight.includes("·")) {
            const parts = rec.weight.split("·");
            curBand = parts[0].trim();
            const rMatch = parts[1].match(/\d+/);
            if (rMatch) curRing = parseInt(rMatch[0]);
          }

          selectorHtml = `
            <div class="compact-selector-bar">
              <div class="selector-row">
                <span class="selector-label">強度:</span>
                <div class="pills-group">
                  ${bandLevels.map(b => `
                    <button class="pill-opt ${curBand === b ? 'active' : ''}" 
                      onclick="selectBandConfig('${ex.id}', '${b}', ${curRing})">${b}</button>
                  `).join('')}
                </div>
              </div>
              <div class="selector-row">
                <span class="selector-label">環位:</span>
                <div class="pills-group">
                  ${bandRings.map(r => `
                    <button class="pill-opt ${curRing === r ? 'active' : ''}" 
                      onclick="selectBandConfig('${ex.id}', '${curBand}', ${r})">R${r}</button>
                  `).join('')}
                </div>
              </div>
              <div class="selector-row">
                <span class="selector-label">休息:</span>
                <div class="pills-group">
                  ${state.config.restOptions.map(r => `
                    <button class="pill-opt ${restSec === r ? 'active' : ''}" 
                      onclick="setExerciseRest('${ex.id}', ${r})">${r}s</button>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        } else {
          // Bodyweight or general
          selectorHtml = `
            <div class="compact-selector-bar">
              <div class="selector-row">
                <span class="selector-label">休息:</span>
                <div class="pills-group">
                  ${state.config.restOptions.map(r => `
                    <button class="pill-opt ${restSec === r ? 'active' : ''}" 
                      onclick="setExerciseRest('${ex.id}', ${r})">${r}s</button>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        }

        // 組別列：消除重複重量輸入，極度緊湊抗爆版 (總寬度收斂至 276px)
        return `
          <div class="exercise-card" id="card-${ex.id}">
            <div class="ex-header">
              <div class="ex-title-wrap">
                <div class="ex-title">
                  ${ex.name} <span class="ex-tag">${ex.tag}</span>
                </div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="moveExercise('${ex.id}', -1)" title="向上排序" ${fIdx === 0 ? 'disabled style="opacity:0.3;"' : ''}>▲</button>
                <button class="icon-btn" onclick="moveExercise('${ex.id}', 1)" title="向下排序" ${fIdx === fTotal - 1 ? 'disabled style="opacity:0.3;"' : ''}>▼</button>
                <button class="icon-btn" onclick="toggleGuideDrawer('${ex.id}')" title="外部焦點要點">ℹ️</button>
              </div>
            </div>

            ${cueHtml}

            <div class="guide-drawer" id="guide-${ex.id}">
              <div class="guide-block">
                <div class="guide-label">🎯 外部焦點 (External Focus)</div>
                <div class="guide-text">${ex.guide.focus}</div>
              </div>
              <div class="guide-block">
                <div class="guide-label">🫁 呼吸引導</div>
                <div class="guide-text">${ex.guide.breath}</div>
              </div>
              <div class="guide-block">
                <div class="guide-label" style="color: #f87171;">⚠️ 安全紅線</div>
                <div class="guide-text">${ex.guide.safety}</div>
              </div>
            </div>

            ${selectorHtml}

            <div class="sets-table">
              ${rec.sets.map((set, sIdx) => `
                <div class="set-row">
                  <span class="set-num">第 ${sIdx + 1} 組</span>
                  <div class="set-reps-control">
                    <button class="adj-btn" onclick="adjReps('${ex.id}', ${sIdx}, -1)">-</button>
                    <input type="number" class="reps-input" value="${set.reps}" onchange="setReps('${ex.id}', ${sIdx}, this.value)" title="次數">
                    <span class="unit-label">下</span>
                    <button class="adj-btn" onclick="adjReps('${ex.id}', ${sIdx}, 1)">+</button>
                  </div>
                  <div class="set-action">
                    <button class="check-btn ${set.done ? 'done' : ''}" onclick="toggleSetDone('${ex.id}', ${sIdx}, ${restSec}, '${ex.name}')">
                      ${set.done ? '✓ 完成' : '完成'}
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      };

      // 1. 樓上區塊
      const f1List = getExercisesForFloor(state.activeDay, "floor1");
      html += `
        <div class="floor-section floor-upstairs">
          <div class="floor-header">
            <span class="floor-title-badge badge-blue">🏠 2F 樓上區 · 彈力帶門錨 ＆ 墊上核心</span>
            <span class="floor-hint">集中完成</span>
          </div>
          ${f1List.map((ex, idx) => renderCard(ex, idx, f1List.length)).join('')}
        </div>
      `;

      // 2. 轉場提醒卡片
      html += `
        <div class="floor-transition-card">
          <span>👟 樓上動作完成！移動至 1F 樓下繼續訓練</span>
        </div>
      `;

      // 3. 樓下區塊
      const f2List = getExercisesForFloor(state.activeDay, "floor2");
      html += `
        <div class="floor-section floor-downstairs">
          <div class="floor-header">
            <span class="floor-title-badge badge-green">🏋️ 1F 樓下區 · 可調壺鈴 ＆ 健力腳踏車</span>
            <span class="floor-hint">壺鈴與心肺</span>
          </div>
          ${f2List.map((ex, idx) => renderCard(ex, idx, f2List.length)).join('')}
          
          <!-- Zone 2 Cardio Block -->
          <div class="zone2-card">
            <h3 style="font-size: 0.96rem; margin-bottom: 2px;">
              🚴 健力腳踏車 Zone 2 (18分鐘)
            </h3>
            <p style="font-size: 0.74rem; color: var(--text-muted); margin-bottom: 6px;">
              體感準則：鼻吸鼻呼 1:1 · 微喘可說完整句子 · 80–90 RPM
            </p>

            <div class="breath-circle-wrap">
              <div class="breath-circle" id="breath-circle">
                <span id="breath-text">準備吸氣</span>
              </div>
            </div>

            <div style="font-family: var(--font-mono); font-size: 1.9rem; font-weight: 700; margin-bottom: 10px;" id="zone2-timer">
              18:00
            </div>

            <div style="display: flex; justify-content: center; gap: 8px;">
              <button class="btn btn-accent" id="btn-zone2-toggle" onclick="toggleZone2()">開始踩踏</button>
              <button class="btn btn-secondary" onclick="resetZone2()">重置</button>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;

      updateCompletionStats();
      checkDoubleProgressionNotice();
      renderZone2Display();
    }

    function renderStatusNotice() {
      const statusP = document.getElementById("last-workout-status");
      if (!state.lastCompletedTime) {
        statusP.textContent = "歡迎開始！這是你的第一次訓練。";
        return;
      }
      const lastDate = new Date(state.lastCompletedTime);
      const diffDays = Math.floor((new Date() - lastDate) / (1000 * 60 * 60 * 24));
      
      let msg = `前次完成：${state.lastCompletedDay} (${diffDays === 0 ? '今天' : `${diffDays}天前`})`;
      if (diffDays >= 4) {
        msg += " · ⚠️ 間隔逾 4 天，建議首組保留 2 下儲備次數 (RIR 2)。";
      } else {
        msg += " · 狀態機自動滾動推薦。";
      }
      statusP.textContent = msg;
    }

    function toggleSetDone(exId, setIdx, restAfter, exName) {
      if (!state.records[exId]) initExerciseRecord(exId);
      const set = state.records[exId].sets[setIdx];
      set.done = !set.done;
      saveState();
      renderAll();

      if (set.done) {
        playBeep(880, 0.15);
        if (restAfter > 0) {
          startRestTimer(restAfter, exName);
        }
      }
    }

    function selectKbWeight(exId, weightNum) {
      if (!state.records[exId]) initExerciseRecord(exId);
      state.records[exId].weight = `${weightNum}kg`;
      saveState();
      renderAll();
    }

    function selectBandConfig(exId, levelStr, ringNum) {
      if (!state.records[exId]) initExerciseRecord(exId);
      state.records[exId].weight = `${levelStr} · 第${ringNum}環`;
      saveState();
      renderAll();
    }

    function setExerciseRest(exId, sec) {
      if (!state.records[exId]) initExerciseRecord(exId);
      state.records[exId].restAfter = sec;
      saveState();
      renderAll();
    }

    function adjReps(exId, setIdx, delta) {
      if (!state.records[exId]) initExerciseRecord(exId);
      const set = state.records[exId].sets[setIdx];
      set.reps = Math.max(1, (parseInt(set.reps) || 10) + delta);
      saveState();
      renderAll();
    }

    function setReps(exId, setIdx, val) {
      if (!state.records[exId]) initExerciseRecord(exId);
      state.records[exId].sets[setIdx].reps = parseInt(val) || 10;
      saveState();
    }

    function initExerciseRecord(exId) {
      let matchedEx = null;
      for (const day of ['A', 'B']) {
        const list = [...TEMPLATES[day].floor1.exercises, ...TEMPLATES[day].floor2.exercises];
        matchedEx = list.find(e => e.id === exId);
        if (matchedEx) break;
      }
      const defaultW = matchedEx ? matchedEx.defaultWeight : "12kg";
      const defaultR = matchedEx ? matchedEx.defaultReps : 10;
      const defaultRest = matchedEx ? matchedEx.defaultRest : 45;

      state.records[exId] = {
        weight: defaultW,
        restAfter: defaultRest,
        sets: [
          { reps: defaultR, done: false },
          { reps: defaultR, done: false },
          { reps: defaultR, done: false }
        ]
      };
    }

    function updateCompletionStats() {
      let totalSets = 0;
      let doneSets = 0;
      const tpl = TEMPLATES[state.activeDay];
      const allEx = [...tpl.floor1.exercises, ...tpl.floor2.exercises];

      allEx.forEach(ex => {
        const rec = state.records[ex.id];
        if (rec && rec.sets) {
          rec.sets.forEach(s => {
            totalSets++;
            if (s.done) doneSets++;
          });
        }
      });

      document.getElementById("completion-counter").textContent = `${doneSets} / ${totalSets} 組完成`;
    }

    function checkDoubleProgressionNotice() {
      const banner = document.getElementById("progress-banner");
      const bannerText = document.getElementById("progress-banner-text");
      const tpl = TEMPLATES[state.activeDay];
      const allEx = [...tpl.floor1.exercises, ...tpl.floor2.exercises];

      const qualified = [];
      allEx.forEach(ex => {
        const rec = state.records[ex.id];
        if (rec && rec.sets && rec.sets.every(s => s.done && s.reps >= 12)) {
          qualified.push(ex.name);
        }
      });

      if (qualified.length > 0) {
        banner.style.display = "flex";
        bannerText.textContent = `🔥 雙重進階達標：【${qualified.join('、')}】連續 3 組滿 12 下！下次可晉升阻力或增加負重。`;
      } else {
        banner.style.display = "none";
      }
    }

    function finishWorkoutSession() {
      if (!confirm(`確定完結今日的【${state.activeDay}】課表嗎？\n完成後系統將自動為你切換至下一個輪替課表。`)) return;

      const tpl = TEMPLATES[state.activeDay];
      const allEx = [...tpl.floor1.exercises, ...tpl.floor2.exercises];

      allEx.forEach(ex => {
        const rec = state.records[ex.id];
        if (rec) {
          const repsStr = rec.sets.map(s => s.reps).join('/');
          rec.lastSummary = `${rec.weight} | ${repsStr}下`;
          rec.sets.forEach(s => s.done = false);
        }
      });

      state.lastCompletedDay = state.activeDay;
      state.lastCompletedTime = new Date().toISOString();
      state.history.push({
        date: state.lastCompletedTime,
        day: state.activeDay
      });

      state.activeDay = (state.activeDay === "A") ? "B" : "A";
      saveState();
      playBeep(1046, 0.4);
      if (navigator.vibrate) navigator.vibrate([200, 100, 300]);
      alert("🏆 太棒了！今日訓練完整入庫。休假日請好好放空恢復！");
      renderAll();
    }

    // ==========================================
    // 8. BACKUP & SETTINGS MODAL
    // ==========================================
    function openBackupModal() {
      document.getElementById("cfg-kb-weights").value = (state.config.kbLevels || DEFAULT_CONFIG.kbLevels).join(', ');
      document.getElementById("cfg-band-levels").value = (state.config.bandLevels || DEFAULT_CONFIG.bandLevels).join(', ');
      document.getElementById("backup-modal").classList.add("open");
    }

    function closeBackupModal(e) {
      if (!e || e.target.id === "backup-modal") {
        document.getElementById("backup-modal").classList.remove("open");
      }
    }

    function saveCustomConfig() {
      const kbStr = document.getElementById("cfg-kb-weights").value;
      const bandStr = document.getElementById("cfg-band-levels").value;

      const parsedKb = kbStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
      if (parsedKb.length > 0) state.config.kbLevels = parsedKb;

      const parsedBands = bandStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
      if (parsedBands.length > 0) state.config.bandLevels = parsedBands;

      saveState();
      renderAll();
    }

    function exportDataJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `workout_hud_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importDataJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.records) {
            state = imported;
            saveState();
            renderAll();
            alert("備份資料已成功匯入還原！");
            closeBackupModal(null);
          }
        } catch (err) {
          alert("匯入失敗，請確認是否為合法的 JSON 格式。");
        }
      };
      reader.readAsText(file);
    }

    function resetAllDemoData() {
      if (confirm("警告：這將清空目前所有儲存的訓練記錄，確定要重置嗎？")) {
        localStorage.removeItem(STORAGE_KEY);
        state = {
          activeDay: "A",
          lastCompletedDay: null,
          lastCompletedTime: null,
          history: [],
          records: {},
          customOrder: { A: [], B: [] },
          config: JSON.parse(JSON.stringify(DEFAULT_CONFIG))
        };
        renderAll();
        closeBackupModal(null);
      }
    }

    // Initialize
    loadState();
    renderAll();
  </script>
</body>
</html>
