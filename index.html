<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workout HUD — 居家運動專注儀表板</title>
  <meta name="theme-color" content="#0b0e14">
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #141822;
      --card-border: #232a3b;
      --text-main: #f0f4fc;
      --text-muted: #8b9bb4;
      --accent: #10b981;
      --accent-dim: rgba(16, 185, 129, 0.15);
      --accent-glow: rgba(16, 185, 129, 0.4);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.15);
      --blue: #3b82f6;
      --blue-dim: rgba(59, 130, 246, 0.15);
      --red: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Bar */
    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 14, 20, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: var(--accent);
      font-size: 0.8rem;
      background: var(--accent-dim);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent);
    }

    .top-actions {
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Status Banner */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-info h2 {
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .status-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #1f2737;
      color: #93c5fd;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Timer HUD */
    .timer-hud {
      background: #121722;
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .timer-hud.active {
      display: block;
    }

    .timer-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .timer-clock {
      font-family: var(--font-mono);
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      margin: 8px 0;
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-accent {
      background: var(--accent);
      color: #042f2e;
    }

    .btn-secondary {
      background: #232a3b;
      color: var(--text-main);
    }

    .btn-amber {
      background: var(--amber);
      color: #451a03;
    }

    /* Sections */
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 8px 0 4px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Exercise Item Card */
    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 10px;
    }

    .ex-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ex-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e2638;
      color: #94a3b8;
      white-space: nowrap;
    }

    .ex-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    .ex-history-chip {
      font-size: 0.75rem;
      color: var(--amber);
      background: var(--amber-dim);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Set Rows */
    .sets-table {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
    }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid #1c2333;
      gap: 8px;
    }

    .set-num {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      width: 44px;
      flex-shrink: 0;
    }

    .set-inputs {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: center;
    }

    .input-pill {
      display: flex;
      align-items: center;
      background: #0d111a;
      border: 1px solid #232b3e;
      border-radius: 8px;
      overflow: hidden;
    }

    /* 16px font-size to prevent iOS Safari auto-zoom */
    .input-pill input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      width: 58px;
      text-align: center;
      padding: 6px 0;
    }

    .input-pill span {
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-right: 6px;
    }

    /* 44px Touch Target */
    .adj-btn {
      background: #1c2333;
      color: #cbd5e1;
      border: none;
      width: 44px;
      height: 40px;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .adj-btn:active {
      background: var(--accent);
      color: #000;
    }

    .set-action {
      width: 80px;
      text-align: right;
      flex-shrink: 0;
    }

    .check-btn {
      background: #1c2333;
      border: 1px solid #2b364d;
      color: var(--text-muted);
      border-radius: 8px;
      height: 40px;
      width: 100%;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .check-btn.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #042f2e;
    }

    /* Zone 2 Card */
    .zone2-card {
      background: linear-gradient(145deg, #121824, #0d121c);
      border: 1px solid #223049;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .breath-circle-wrap {
      width: 140px;
      height: 140px;
      margin: 16px auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .breath-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent);
      transition: transform 4s ease-in-out;
    }

    .breath-circle.inhale {
      transform: scale(1.35);
      background: rgba(16, 185, 129, 0.3);
    }

    .breath-circle.exhale {
      transform: scale(0.9);
      background: var(--accent-dim);
    }

    .progress-banner {
      background: var(--accent-dim);
      border: 1px dashed var(--accent);
      color: #a7f3d0;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      gap: 8px;
      line-height: 1.4;
    }

    /* Footer Navigation with Safe Area Inset */
    footer {
      padding: 14px 16px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      bottom: 0;
      z-index: 40;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal for Backup / Restore */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      max-width: 440px;
      width: 100%;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand">
      WORKOUT <span>HUD</span>
    </div>
    <div class="top-actions">
      <button class="pill-btn" id="btn-switch-a" onclick="switchWorkout('A')">Day A (推/膝/抗伸)</button>
      <button class="pill-btn" id="btn-switch-b" onclick="switchWorkout('B')">Day B (拉/髖/抗旋)</button>
      <button class="pill-btn" onclick="openBackupModal()" title="資料備份與設定">⚙️</button>
    </div>
  </header>

  <!-- Main HUD View -->
  <main>

    <!-- Rest Timer Overlay -->
    <div class="timer-hud" id="timer-hud">
      <div class="timer-label" id="timer-label">組間休息倒數</div>
      <div class="timer-clock" id="timer-clock">00:45</div>
      <div class="timer-controls">
        <button class="btn btn-secondary" onclick="adjustTimer(-15)">-15s</button>
        <button class="btn btn-secondary" onclick="adjustTimer(+15)">+15s</button>
        <button class="btn btn-amber" onclick="skipTimer()">跳過休息 ➔</button>
      </div>
    </div>

    <!-- Status & Smart Advisory -->
    <div class="status-card">
      <div class="status-info">
        <h2 id="current-day-heading">今日課表：Day A</h2>
        <p id="last-workout-status">上一次訓練：計算中...</p>
      </div>
      <div class="status-tag" id="status-tag">做二休二狀態機</div>
    </div>

    <!-- Double Progression Alert -->
    <div class="progress-banner" id="progress-banner">
      🔥 <span id="progress-banner-text">目標達成！已解鎖下一次升重門檻。</span>
    </div>

    <!-- Dynamic Workout Sections -->
    <div id="workout-content">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Zone 2 Cardio Block -->
    <div class="section-title">
      <span>階段三：健力腳踏車有氧</span>
      <span style="color: var(--accent);">Zone 2 代謝恢復</span>
    </div>
    <div class="zone2-card">
      <h3 style="font-size: 1.1rem; margin-bottom: 4px;">Zone 2 心肺踩踏 (18分鐘)</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted);">
        體感準則：鼻吸鼻呼 1:1 · 微喘但可說完整句子 · 踏頻 80–90 RPM
      </p>

      <div class="breath-circle-wrap">
        <div class="breath-circle" id="breath-circle">
          <span id="breath-text">準備吸氣</span>
        </div>
      </div>

      <div style="font-family: var(--font-mono); font-size: 2.2rem; font-weight: 700; margin-bottom: 12px;" id="zone2-timer">
        18:00
      </div>

      <div style="display: flex; justify-content: center; gap: 12px;">
        <button class="btn btn-accent" id="btn-zone2-toggle" onclick="toggleZone2()">開始踩踏</button>
        <button class="btn btn-secondary" onclick="resetZone2()">重置</button>
      </div>
    </div>

  </main>

  <!-- Sticky Bottom Finish Bar -->
  <footer>
    <div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">本輪進度</div>
      <div style="font-size: 0.95rem; font-weight: 700;" id="completion-counter">0 / 12 組完成</div>
    </div>
    <button class="btn btn-accent" style="padding: 12px 24px; font-size: 1rem;" onclick="finishWorkoutSession()">
      完結今日課表 🏆
    </button>
  </footer>

  <!-- Modal: Data Backup & Restore -->
  <div class="modal-overlay" id="backup-modal" onclick="closeBackupModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 style="margin-bottom: 8px;">⚙️ 數據管理 (Local-First)</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;">
        所有訓練紀錄長存在本地瀏覽器。可在此匯出備份 JSON，或在更換裝置時匯入。
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-secondary" onclick="exportDataJson()">📥 匯出紀錄備份 (JSON)</button>
        <label class="btn btn-secondary" style="cursor: pointer; text-align: center;">
          📤 匯入備份檔案
          <input type="file" id="import-file-input" style="display: none;" onchange="importDataJson(event)" accept=".json">
        </label>
        <button class="btn btn-amber" onclick="resetAllDemoData()">⚠️ 重設為初始預設課表</button>
        <button class="btn btn-secondary" onclick="closeBackupModal(null)">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. DATA SCHEMA & WORKOUT TEMPLATES
    // ==========================================
    const BAND_LEVELS = ["極輕", "輕阻力", "中阻力", "重阻力", "超重"];

    const TEMPLATES = {
      A: {
        title: "Day A — 胸 ＋ 膝主導 ＋ 側肩三頭 ＋ 核心抗伸展",
        block1Title: "區塊一：主肌肥大超組 (下肢 ↔ 上肢交替 · 3組)",
        block1: [
          {
            id: "a_split_squat",
            name: "原地負重分腿蹲",
            tag: "膝主導 / 離心拉伸髂腰肌",
            tool: "可調壺鈴 (軀幹前傾15度，拉開後髖)",
            targetReps: "8–12下",
            defaultWeight: 14,
            defaultReps: 10,
            restAfter: 45
          },
          {
            id: "a_pushup",

            targetReps: "8–12下",
            defaultWeight: "中阻力",
            defaultReps: 10,
            restAfter: 75
          }
        ],
        block2Title: "區塊二：側肩三頭與核心抗伸展 (3合組 · 3組)",
        block2: [
          {
            id: "a_lateral_raise",
            name: "彈力繩站姿側平舉",
            tag: "三角肌中束",
            tool: "雙腳踩繩 / 肘微彎導向斜前",
            targetReps: "12–15下",
            defaultWeight: "輕阻力",
            defaultReps: 12,
            restAfter: 15
          },
          {
            id: "a_tricep_ext",
            name: "門錨/踩繩三頭過頂伸展",
            tag: "肱三頭肌長頭",
            tool: "彈力繩 (頂峰完全鎖定伸展)",
            targetReps: "12–15下",
            defaultWeight: "中阻力",
            defaultReps: 12,
            restAfter: 15
          },
          {
            id: "a_deadbug",
            name: "核心死蟲式 / 門錨彈力繩前推",
            tag: "核心抗伸展 (保護腰椎)",
            tool: "徒手或門錨胸高 (腰椎緊貼地面)",
            targetReps: "每側10–12下",
            defaultWeight: "徒手/輕繩",
            defaultReps: 10,
            restAfter: 60
          }
        ]
      },
      B: {
        title: "Day B — 背 ＋ 髖主導 ＋ 圓肩後肩 ＋ 二頭 ＋ 核心抗旋",
        block1Title: "區塊一：主肌肥大超組 (後側鏈 ↔ 闊背交替 · 3組)",
        block1: [
          {
            id: "b_rdl",
            name: "壺鈴羅馬尼亞硬舉 (RDL)",
            tag: "髖主導 / 後側鉸鏈",
            tool: "可調壺鈴 (屁股後推折髖，嚴禁盲目碰地)",
            targetReps: "8–12下",
            defaultWeight: 20,
            defaultReps: 10,
            restAfter: 45
          },
          {
            id: "b_single_row",
            name: "可調壺鈴單臂划船",
            tag: "闊背肌 / 上背厚度",
            tool: "可調壺鈴 (一手撐椅，手肘往髖骨方向後拉)",
            targetReps: "每側8–12下",
            defaultWeight: 16,
            defaultReps: 10,
            restAfter: 75
          }
        ],
        block2Title: "區塊二：圓肩修正、二頭與核心抗旋 (3合組 · 3組)",
        block2: [
          {
            id: "b_face_pull",
            name: "門錨高位面拉 (Face Pull)",
            tag: "逆轉圓肩 / 外旋後三角",
            tool: "彈力繩門錨 (額頭高度+雙手向外展旋)",
            targetReps: "12–15下",
            defaultWeight: "中阻力",
            defaultReps: 12,
            restAfter: 15
          },
          {
            id: "b_bicep_curl",
            name: "彈力繩/壺鈴二頭彎舉",
            tag: "肱二頭肌",
            tool: "雙腳踩繩或單手壺鈴 (掌心向上擠壓)",
            targetReps: "12–15下",
            defaultWeight: "中阻力",
            defaultReps: 12,
            restAfter: 15
          },
          {
            id: "b_pallof_press",
            name: "門錨 Pallof Press (抗旋轉推)",
            tag: "核心抗旋轉剛性",
            tool: "彈力繩門錨 (平推伸直停頓2秒)",
            targetReps: "每側10–12下",
            defaultWeight: "中阻力",
            defaultReps: 10,
            restAfter: 60
          }
        ]
      }
    };

    const STORAGE_KEY = "WORKOUT_HUD_STORE_V2";

    let state = {
      activeDay: null,
      lastCompletedDay: null,
      lastCompletedTime: null,
      history: [],
      records: {}
    };

    // ==========================================
    // 2. WAKE LOCK API (防止手機螢幕休眠導致計時漂移)
    // ==========================================
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("WakeLock unavailable", err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => wakeLock = null).catch(() => {});
      }
    }

    // ==========================================
    // 3. AUDIO SYNTHESIZER (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    // 首次使用者手勢解鎖音訊上下文
    function unlockAudioOnFirstInteraction() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      document.removeEventListener('touchstart', unlockAudioOnFirstInteraction);
      document.removeEventListener('click', unlockAudioOnFirstInteraction);
    }
    document.addEventListener('touchstart', unlockAudioOnFirstInteraction, { passive: true });
    document.addEventListener('click', unlockAudioOnFirstInteraction, { passive: true });

    async function playBeep(freq = 880, duration = 0.12) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Audio play blocked", e);
      }
    }

    // ==========================================
    // 4. PERSISTENCE & ROLLING STATE MACHINE
    // ==========================================
    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        } catch (e) {
          console.error("Failed to parse storage", e);
        }
      }
      // 僅在尚未顯式選擇當日課表時，由上次完成狀態自動推導滾動隊列
      if (!state.activeDay) {
        if (state.lastCompletedDay === "A") {
          state.activeDay = "B";
        } else {
          state.activeDay = "A";
        }
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // ==========================================
    // 5. REST TIMER (Timestamp Delta 防背景漂移)
    // ==========================================
    let timerInterval = null;
    let timerEndTime = null;
    let timerRemaining = 0;

    function startRestTimer(seconds) {
      clearInterval(timerInterval);
      requestWakeLock();
      
      const hud = document.getElementById("timer-hud");
      hud.classList.add("active");
      timerEndTime = Date.now() + seconds * 1000;
      timerRemaining = seconds;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timerRemaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
        
        if (timerRemaining <= 3 && timerRemaining > 0) {
          playBeep(660, 0.1);
        } else if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          releaseWakeLock();
          playBeep(1320, 0.4);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          hud.classList.remove("active");
        }
        updateTimerDisplay();
      }, 500);
    }

    function updateTimerDisplay() {
      const min = Math.floor(Math.max(0, timerRemaining) / 60);
      const sec = Math.max(0, timerRemaining) % 60;
      document.getElementById("timer-clock").textContent = 
        `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function adjustTimer(diff) {
      if (!timerEndTime) return;
      timerEndTime += diff * 1000;
      timerRemaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
      updateTimerDisplay();
    }

    function skipTimer() {
      clearInterval(timerInterval);
      releaseWakeLock();
      document.getElementById("timer-hud").classList.remove("active");
    }

    // ==========================================
    // 6. ZONE 2 BIKING & BREATH PACER
    // ==========================================
    let zone2Interval = null;
    let zone2EndTime = null;
    let zone2Remaining = 18 * 60;
    let breathInterval = null;
    let isZone2Running = false;

    function toggleZone2() {
      const btn = document.getElementById("btn-zone2-toggle");
      if (isZone2Running) {
        clearInterval(zone2Interval);
        clearInterval(breathInterval);
        releaseWakeLock();
        isZone2Running = false;
        btn.textContent = "繼續踩踏";
        btn.classList.remove("btn-amber");
        btn.classList.add("btn-accent");
      } else {
        isZone2Running = true;
        requestWakeLock();
        btn.textContent = "暫停踩踏";
        btn.classList.remove("btn-accent");
        btn.classList.add("btn-amber");
        runBreathCycle();

        zone2EndTime = Date.now() + zone2Remaining * 1000;

        zone2Interval = setInterval(() => {
          zone2Remaining = Math.max(0, Math.round((zone2EndTime - Date.now()) / 1000));
          if (zone2Remaining <= 0) {
            clearInterval(zone2Interval);
            clearInterval(breathInterval);
            releaseWakeLock();
            playBeep(1760, 0.8);
            if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
            alert("🎉 Zone 2 踩踏完成！微血管與粒線體代謝修復完成。");
          }
          renderZone2Display();
        }, 500);
      }
    }

    function runBreathCycle() {
      const circle = document.getElementById("breath-circle");
      const text = document.getElementById("breath-text");
      let phase = "inhale";

      const step = () => {
        if (!isZone2Running) return;
        if (phase === "inhale") {
          circle.classList.remove("exhale");
          circle.classList.add("inhale");
          text.textContent = "鼻吸氣 (4s)";
          phase = "exhale";
        } else {
          circle.classList.remove("inhale");
          circle.classList.add("exhale");
          text.textContent = "鼻呼氣 (4s)";
          phase = "inhale";
        }
      };
      step();
      breathInterval = setInterval(step, 4000);
    }

    function resetZone2() {
      clearInterval(zone2Interval);
      clearInterval(breathInterval);
      releaseWakeLock();
      isZone2Running = false;
      zone2Remaining = 18 * 60;
      document.getElementById("btn-zone2-toggle").textContent = "開始踩踏";
      document.getElementById("btn-zone2-toggle").className = "btn btn-accent";
      document.getElementById("breath-circle").className = "breath-circle";
      document.getElementById("breath-text").textContent = "準備吸氣";
      renderZone2Display();
    }

    function renderZone2Display() {
      const min = Math.floor(zone2Remaining / 60);
      const sec = zone2Remaining % 60;
      document.getElementById("zone2-timer").textContent = 
        `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    // ==========================================
    // 7. RENDER ENGINE & INTERACTION
    // ==========================================
    function switchWorkout(day) {
      state.activeDay = day;
      saveState();
      renderAll();
    }

    function renderAll() {
      document.getElementById("btn-switch-a").classList.toggle("active", state.activeDay === "A");
      document.getElementById("btn-switch-b").classList.toggle("active", state.activeDay === "B");

      const tpl = TEMPLATES[state.activeDay];
      document.getElementById("current-day-heading").textContent = `今日課表：${tpl.title.split('—')[0]}`;

      renderStatusNotice();

      const container = document.getElementById("workout-content");
      let html = "";

      const renderGroup = (title, items) => {
        let blockHtml = `<div class="section-title"><span>${title}</span></div>`;
        items.forEach(ex => {
          if (!state.records[ex.id]) {
            initExerciseRecord(ex.id);
          }
          const rec = state.records[ex.id];

          blockHtml += `
            <div class="exercise-card" id="card-${ex.id}">
              <div class="ex-header">
                <div>
                  <div class="ex-title">${ex.name} <span class="ex-tag">${ex.tag}</span></div>
                  <div class="ex-meta">器材：${ex.tool} · 目標：${ex.targetReps}</div>
                </div>
                <div class="ex-history-chip">
                  上次: ${rec.lastSummary || `${rec.weight} | 10下`}
                </div>
              </div>
              <div class="sets-table">
          `;

          rec.sets.forEach((set, sIdx) => {
            blockHtml += `
              <div class="set-row">
                <span class="set-num">第 ${sIdx + 1} 組</span>
                <div class="set-inputs">
                  <div class="input-pill">
                    <button class="adj-btn" onclick="adjWeight('${ex.id}', -1)">-</button>
                    <input type="text" value="${rec.weight}" onchange="setWeight('${ex.id}', this.value)" title="負重/阻力">
                    <button class="adj-btn" onclick="adjWeight('${ex.id}', 1)">+</button>
                  </div>
                  <div class="input-pill">
                    <button class="adj-btn" onclick="adjReps('${ex.id}', ${sIdx}, -1)">-</button>
                    <input type="number" value="${set.reps}" onchange="setReps('${ex.id}', ${sIdx}, this.value)" title="次數">
                    <span>下</span>
                    <button class="adj-btn" onclick="adjReps('${ex.id}', ${sIdx}, 1)">+</button>
                  </div>
                </div>
                <div class="set-action">
                  <button class="check-btn ${set.done ? 'done' : ''}" onclick="toggleSetDone('${ex.id}', ${sIdx}, ${ex.restAfter})">
                    ${set.done ? '✓ 完成' : '完成'}
                  </button>
                </div>
              </div>
            `;
          });

          blockHtml += `</div></div>`;
        });
        return blockHtml;
      };

      html += renderGroup(tpl.block1Title, tpl.block1);
      html += renderGroup(tpl.block2Title, tpl.block2);
      container.innerHTML = html;

      updateCompletionStats();
      checkDoubleProgressionNotice();
    }

    function renderStatusNotice() {
      const statusP = document.getElementById("last-workout-status");
      if (!state.lastCompletedTime) {
        statusP.textContent = "歡迎開始！這是你的第一次訓練。";
        return;
      }
      const lastDate = new Date(state.lastCompletedTime);
      const diffDays = Math.floor((new Date() - lastDate) / (1000 * 60 * 60 * 24));
      
      let msg = `前次完成：${state.lastCompletedDay} (${diffDays === 0 ? '今天' : `${diffDays}天前`})`;
      if (diffDays >= 4) {
        msg += " · ⚠️ 間隔逾 4 天，建議首組保留 2 下儲備次數 (RIR 2) 預防 DOMS。";
      } else {
        msg += " · 狀態機自動滾動推薦。";
      }
      statusP.textContent = msg;
    }

    function toggleSetDone(exId, setIdx, restAfter) {
      if (!state.records[exId]) initExerciseRecord(exId);
      const set = state.records[exId].sets[setIdx];
      set.done = !set.done;
      saveState();
      renderAll();

      if (set.done) {
        playBeep(880, 0.15);
        if (restAfter > 0) {
          startRestTimer(restAfter);
        }
      }
    }

    // 支援字串阻力階梯（彈力繩）與數值（壺鈴 kg）平滑增減
    function adjWeight(exId, delta) {
      if (!state.records[exId]) initExerciseRecord(exId);
      const curVal = state.records[exId].weight;

      if (typeof curVal === "string" && BAND_LEVELS.includes(curVal)) {
        let idx = BAND_LEVELS.indexOf(curVal);
        let nextIdx = Math.max(0, Math.min(BAND_LEVELS.length - 1, idx + delta));
        state.records[exId].weight = BAND_LEVELS[nextIdx];
      } else {
        let cur = parseFloat(curVal);
        if (isNaN(cur)) {
          state.records[exId].weight = (delta > 0) ? BAND_LEVELS[2] : BAND_LEVELS[0];
        } else {
          state.records[exId].weight = Math.max(0, cur + delta * 2);
        }
      }
      saveState();
      renderAll();
    }

    function setWeight(exId, val) {
      if (!state.records[exId]) initExerciseRecord(exId);
      state.records[exId].weight = val;
      saveState();
    }

    function adjReps(exId, setIdx, delta) {
      if (!state.records[exId]) initExerciseRecord(exId);
      const set = state.records[exId].sets[setIdx];
      set.reps = Math.max(1, (parseInt(set.reps) || 10) + delta);
      saveState();
      renderAll();
    }

    function setReps(exId, setIdx, val) {
      if (!state.records[exId]) initExerciseRecord(exId);
      state.records[exId].sets[setIdx].reps = parseInt(val) || 10;
      saveState();
    }

    // 正確從 TEMPLATES 繼承動作預設參數，避免抹除
    function initExerciseRecord(exId) {
      let matchedEx = null;
      for (const day of ['A', 'B']) {
        const list = [...TEMPLATES[day].block1, ...TEMPLATES[day].block2];
        matchedEx = list.find(e => e.id === exId);
        if (matchedEx) break;
      }
      const defaultW = matchedEx ? matchedEx.defaultWeight : 12;
      const defaultR = matchedEx ? matchedEx.defaultReps : 10;

      state.records[exId] = {
        weight: defaultW,
        sets: [
          { reps: defaultR, done: false },
          { reps: defaultR, done: false },
          { reps: defaultR, done: false }
        ]
      };
    }

    function updateCompletionStats() {
      let totalSets = 0;
      let doneSets = 0;
      const tpl = TEMPLATES[state.activeDay];
      const allEx = [...tpl.block1, ...tpl.block2];

      allEx.forEach(ex => {
        const rec = state.records[ex.id];
        if (rec && rec.sets) {
          rec.sets.forEach(s => {
            totalSets++;
            if (s.done) doneSets++;
          });
        }
      });

      document.getElementById("completion-counter").textContent = `${doneSets} / ${totalSets} 組完成`;
    }

    // 遍歷所有複合動作的雙重進階檢測
    function checkDoubleProgressionNotice() {
      const banner = document.getElementById("progress-banner");
      const bannerText = document.getElementById("progress-banner-text");
      const tpl = TEMPLATES[state.activeDay];
      const allEx = [...tpl.block1, ...tpl.block2];

      const qualified = [];
      allEx.forEach(ex => {
        const rec = state.records[ex.id];
        if (rec && rec.sets && rec.sets.every(s => s.done && s.reps >= 12)) {
          qualified.push(ex.name);
        }
      });

      if (qualified.length > 0) {
        banner.style.display = "flex";
        bannerText.textContent = `🔥 雙重進階達標：【${qualified.join('、')}】連續 3 組滿 12 下！下次可晉升阻力或拉長離心。`;
      } else {
        banner.style.display = "none";
      }
    }

    function finishWorkoutSession() {
      if (!confirm(`確定完結今日的【${state.activeDay}】課表嗎？\n完成後系統將自動為你切換至下一個輪替課表。`)) return;

      const tpl = TEMPLATES[state.activeDay];
      const allEx = [...tpl.block1, ...tpl.block2];

      allEx.forEach(ex => {
        const rec = state.records[ex.id];
        if (rec) {
          const repsStr = rec.sets.map(s => s.reps).join('/');
          rec.lastSummary = `${rec.weight} | ${repsStr}下`;
          rec.sets.forEach(s => s.done = false);
        }
      });

      state.lastCompletedDay = state.activeDay;
      state.lastCompletedTime = new Date().toISOString();
      state.history.push({
        date: state.lastCompletedTime,
        day: state.activeDay
      });

      state.activeDay = (state.activeDay === "A") ? "B" : "A";
      saveState();
      playBeep(1046, 0.4);
      if (navigator.vibrate) navigator.vibrate([200, 100, 300]);
      alert("🏆 太棒了！今日訓練完整入庫。休假日請好好放空恢復！");
      renderAll();
    }

    // ==========================================
    // 8. BACKUP & RESTORE MODAL
    // ==========================================
    function openBackupModal() {
      document.getElementById("backup-modal").classList.add("open");
    }
    function closeBackupModal(e) {
      if (!e || e.target.id === "backup-modal") {
        document.getElementById("backup-modal").classList.remove("open");
      }
    }

    function exportDataJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `workout_hud_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importDataJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.records) {
            state = imported;
            saveState();
            renderAll();
            alert("備份資料已成功匯入還原！");
            closeBackupModal(null);
          }
        } catch (err) {
          alert("匯入失敗，請確認是否為合法的 JSON 格式。");
        }
      };
      reader.readAsText(file);
    }

    function resetAllDemoData() {
      if (confirm("警告：這將清空目前所有儲存的訓練記錄，確定要重置嗎？")) {
        localStorage.removeItem(STORAGE_KEY);
        state = {
          activeDay: "A",
          lastCompletedDay: null,
          lastCompletedTime: null,
          history: [],
          records: {}
        };
        renderAll();
        closeBackupModal(null);
      }
    }

    // Initialize
    loadState();
    renderAll();
    renderZone2Display();
  </script>
</body>
</html>
